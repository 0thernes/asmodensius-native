# SPDX-License-Identifier: Apache-2.0
name: Automated Tag Release, SHA256SUMS & SLSA Provenance

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package-release:
    name: Assemble Release Bundle, SHA256SUMS & SLSA Attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify checksums, timestamps, README axioms, and blueprint
        run: |
          sha256sum -c CHECKSUMS.sha256
          python3 -I scripts/stamp_timestamps.py --verify
          python3 -I scripts/check_readme_axioms.py
          python3 -I scripts/check_blueprint.py
          python3 -I tools/check_text.py
      - name: Assemble release assets and SHA256SUMS
        run: |
          mkdir -p release_assets
          cp dist/Donahue_2026_asmodensius_native.pdf release_assets/
          cp dist/arxiv_submission.tar.gz release_assets/
          cp results/lean4-asmodensius-audit.txt release_assets/
          cp results/lean4-multi-kernel.txt release_assets/
          cp results/citation-audit.json release_assets/
          cp CHECKSUMS.sha256 CHECKSUMS.sha256.tsr CHECKSUMS.sha256.ots release_assets/
          cp data/MANIFEST.sha256 release_assets/DATA_MANIFEST.sha256
          cp croissant.json ro-crate-metadata.json codemeta.json CITATION.cff release_assets/
          (cd release_assets && sha256sum * > SHA256SUMS)
          cat release_assets/SHA256SUMS
      - name: Attest build provenance (SLSA / Sigstore Rekor)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release_assets/*"
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: asmodensius-native-release-bundle
          path: release_assets/
      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_assets/* --clobber
          else
            gh release create "$TAG" release_assets/* \
              --title "Asmodensius-Native ${TAG}" \
              --notes "Automated release bundle for Asmodensius-Native ${TAG} with SHA256SUMS, DigiCert RFC 3161 timestamp, Bitcoin OpenTimestamps proof, SLSA build provenance, frozen AMS-LaTeX preprint, arXiv tarball, and Lean 4.35.0 multi-kernel audit artifacts. Independent technical preprint (not peer-reviewed); 0 / 1,900 Mega-Atlas open problems retired."
          fi
